# Starship configuration - Tokyo Night Lean Theme

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$line_break\
$character"""

right_format = """
$jobs\
$nix_shell\
$cmd_duration\
$status\
$time"""

# --- Palette Definition ---
# Blue: #7aa2f7
# Cyan: #7dcfff
# Purple: #bb9af7
# Red: #f7768e
# Green: #9ece6a
# Yellow: #e0af68
# Orange: #ff9e64
# Grey: #565f89

[os]
disabled = false
style = "bold #7aa2f7"
format = "[$symbol]($style) "

[os.symbols]
AIX = " "
AlmaLinux = " "
Alpaquita = " "
Alpine = " "
ALTLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = " "
Artix = " "
Bluefin = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Elementary = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = " "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = " "
InstantOS = " "
Ios = "󰀷 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = " "
OpenCloudOS = " "
openEuler = " "
openSUSE = " "
OracleLinux = "󰺡 "
PikaOS = " "
Pop = " "
Raspbian = " "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Redox = "󰀘 "
RockyLinux = " "
Solus = " "
SUSE = " "
Ubuntu = " "
Ultramarine = " "
Unknown = " "
Uos = " "
Void = " "
Windows = "󰍲 "
Zorin = " "

[username]
show_always = true
style_user = "bold #bb9af7"
style_root = "bold #f7768e"
format = "[$user]($style) "

[hostname]
ssh_only = false
style = "bold #7aa2f7"
format = "at [$hostname]($style) "

[directory]
style = "bold #7dcfff"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
format = "in [$path]($style) "

[git_branch]
symbol = " "
style = "bold #bb9af7"
format = "on [$symbol$branch]($style) "

[character]
success_symbol = "[›](bold #9ece6a)"
error_symbol = "[›](bold #f7768e)"
vicmd_symbol = "[›](bold #7aa2f7)"

# --- Right Side Modules ---

[jobs]
symbol = "󰓅 "
style = "bold #e0af68"
format = "[$symbol($jobs)]($style) "

[nix_shell]
symbol = " "
style = "bold #7dcfff"
format = "via [$symbol]($style) "

[cmd_duration]
min_time = 500
style = "bold #e0af68"
format = "took [$duration]($style) "

[status]
symbol = " "
style = "bold #f7768e"
format = "[$symbol]($style) "

[time]
disabled = false
time_format = "%R" # HH:MM
style = "bold #565f89"
format = "at [$time]($style) "


# ==========================================
# Explicitly Disable Unused Modules
# ==========================================

[git_status]
disabled = true

[git_commit]
disabled = true

[git_state]
disabled = true

[git_metrics]
disabled = true

# Cloud / DevOps modules
[aws]
disabled = true

[azure]
disabled = true

[gcloud]
disabled = true

[kubernetes]
disabled = true

[docker_context]
disabled = true

[helm]
disabled = true

[terraform]
disabled = true

# Shell / System modules
[memory_usage]
disabled = true

[shell]
disabled = true

[shlvl]
disabled = true

[sudo]
disabled = true

# Package scan module
[package]
disabled = true